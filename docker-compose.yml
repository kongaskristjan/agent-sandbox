name: agent-sandbox

services:
  agent-dev:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${SANDBOX_ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${SANDBOX_OPENAI_API_KEY:-}
      - SANDBOX_API_KEYS=${SANDBOX_API_KEYS:-false}
      - CODEX_HOME=/home/dev/.codex
      - AGENT_SANDBOX_NO_MPS=${AGENT_SANDBOX_NO_MPS:-}
      # Which agent the entrypoint launches (claude by default; opencode or codex
      # when selected by the wrapper). Lets the entrypoint skip the
      # Claude-only auth/trust steps without a separate image.
      - SANDBOX_AGENT=${SANDBOX_AGENT:-claude}
      # Host OpenAI-compatible server port (--port, opencode only). Empty unless
      # --port is passed; the entrypoint points opencode at
      # http://OPENCODE_API_HOST:OPENCODE_API_PORT/v1 and otherwise leaves
      # opencode's normal provider/auth in place.
      - OPENCODE_API_PORT=${OPENCODE_API_PORT:-}
      - OPENCODE_API_HOST=${OPENCODE_API_HOST:-127.0.0.1}
      - PULSE_SERVER=unix:/run/user/${HOST_UID:-1000}/pulse/native
      - PULSE_COOKIE=/tmp/host-pulse-cookie
    volumes:
      - ${PROJECT_DIR:-.}:/workspace/project
      - ${CLAUDE_CREDENTIALS_FILE:?Run the agent-sandbox wrapper to stage credentials}:/tmp/host-credentials.json:ro
      - ${CLAUDE_CONFIG_FILE:?Run the agent-sandbox wrapper}:/tmp/host-claude.json:ro
      - claude-config:/home/dev/.claude
      # Share the host's personal skills (~/.claude/skills) with the container,
      # so a skill installed once on the host works in both places. Mounted
      # inside the claude-config volume: Docker orders mounts by path depth, so
      # the deeper bind wins at this subpath. Read-only — skills are inputs, and
      # the container has no business writing to the host's config.
      - ${HOME}/.claude/skills:/home/dev/.claude/skills:ro
      # Private host-side copies; the wrapper filters API keys before mounting.
      - ${OPENCODE_AUTH_FILE:?Run the agent-sandbox wrapper}:/tmp/host-opencode-auth.json:ro
      - ${OPENCODE_CONFIG_FILE:?Run the agent-sandbox wrapper}:/tmp/host-opencode.json:ro
      - ${CODEX_AUTH_FILE:?Run the agent-sandbox wrapper}:/tmp/host-codex-auth.json:ro
      - ${CODEX_SETUP_DIR:?Run the agent-sandbox wrapper}:/tmp/host-codex-setup:ro
      - codex-config:/home/dev/.codex
      - opencode-config:/home/dev/.config/opencode
      - opencode-data:/home/dev/.local/share/opencode
      - pip-cache:/root/.cache/pip
      - uv-cache:/home/dev/.cache/uv
      - uv-python:/home/dev/.local/share/uv/python
      - playwright-browsers:/opt/playwright-browsers
      - /run/user/${HOST_UID:-1000}/pulse:/run/user/${HOST_UID:-1000}/pulse
      - ${HOME}/.gitconfig:/tmp/host-gitconfig:ro
      - ${HOME}/.config/pulse/cookie:/tmp/host-pulse-cookie:ro
    working_dir: /workspace/project
    shm_size: '8g'
    stdin_open: true
    tty: true

volumes:
  codex-config:
  claude-config:
  opencode-config:
  opencode-data:
  pip-cache:
  uv-cache:
  uv-python:
  playwright-browsers:
