services:
  agent-dev:
    build:
      context: .
      dockerfile: Dockerfile.rust
    volumes:
      # Cargo's dependency and build caches, persisted the same way the uv cache
      # is. They mount at subdirectories of CARGO_HOME so the toolchain and the
      # rustup shims in ~/.cargo/bin stay visible (a volume on ~/.cargo itself
      # would mask them after a rebuild).
      - cargo-registry:/home/dev/.cargo/registry
      - cargo-git:/home/dev/.cargo/git
      - cargo-target:/home/dev/.cargo/target

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
